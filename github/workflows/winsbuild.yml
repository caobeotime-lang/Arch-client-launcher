name: Build EXE

# .exe Windows phải build trên máy Windows thật (PyInstaller không
# cross-compile) -> workflow chạy trên runner "windows-latest".
#
# Build mặc định là --onedir rồi nén thành ArchClient-windows.zip:
# bản onedir không tự giải nén ra %TEMP% lúc chạy nên gần như không bị
# Windows Defender gắn cờ Trojan:Win32/Wacatac.B!ml như bản --onefile cũ.
# Job "build-onefile" vẫn tạo thêm bản 1 file cho ai cần, đánh dấu rõ là
# có thể bị antivirus báo nhầm.
#
# Mỗi bản build đều kèm file SHA256SUMS để người dùng đối chiếu checksum.

on:
  push:
    branches: [ main, Windows ]
    tags: [ "v*" ]
  workflow_dispatch: {}

# softprops/action-gh-release cần quyền ghi để tạo Release
permissions:
  contents: write

jobs:
  build:
    name: onedir (khuyên dùng - ít bị antivirus flag)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ArchClient (onedir + zip)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python build_windows.py

      - name: Tạo SHA256SUMS
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ArchClient-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  ArchClient-windows.zip" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArchClient-windows
          path: |
            dist/ArchClient-windows.zip
            dist/SHA256SUMS.txt

      - name: Tạo GitHub Release (chỉ khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ArchClient-windows.zip
            dist/SHA256SUMS.txt

  build-onefile:
    name: onefile (1 file .exe - co the bi AV bao nham)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build ArchClient.exe (onefile)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python build_windows.py --onefile

      - name: Tạo SHA256SUMS (onefile)
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ArchClient.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ArchClient.exe" | Out-File -Encoding ascii dist/SHA256SUMS-onefile.txt
          Get-Content dist/SHA256SUMS-onefile.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ArchClient-windows-onefile
          path: |
            dist/ArchClient.exe
            dist/SHA256SUMS-onefile.txt

      - name: Dinh kem vao Release (chi khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ArchClient.exe
            dist/SHA256SUMS-onefile.txt
