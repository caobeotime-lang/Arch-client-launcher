name: Build Windows

on:
  push:
    branches: [ windows ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag của GitHub Release để đăng file lên (vd v1.01). Để trống = chỉ build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ArchClient.exe (onedir + zip)
        run: python build_windows.py

      - name: Kiểm tra file build
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path "dist/ArchClient/ArchClient.exe")) { throw "thiếu ArchClient.exe" }

      - name: Đổi tên file (tên cố định để website trỏ link ổn định)
        shell: pwsh
        run: Move-Item (Get-ChildItem dist/*.zip | Select-Object -First 1).FullName dist/ArchClient-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ArchClient-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Đăng lên GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Arch Client ${{ inputs.release_tag }}
          files: |
            dist/ArchClient-windows-x64.zip
