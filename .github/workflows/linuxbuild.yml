name: Build Linux

on:
  push:
    branches: [ linux ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag của GitHub Release để đăng file lên (vd v1.01). Để trống = chỉ build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    # Build trên bản Ubuntu CŨ nhất còn được hỗ trợ: glibc build ra chỉ chạy
    # được trên distro có glibc BẰNG hoặc MỚI hơn. Build ở 22.04 -> chạy được
    # trên Ubuntu 22.04+, Debian 12, Arch, Fedora 36+, Mint 21+...
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài gói hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 desktop-file-utils libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 "minecraft-launcher-lib>=8.0" requests pypresence pyinstaller

      - name: Build (onedir + tar.gz + AppImage + deb)
        run: python build_linux.py --appimage --deb --skip-deps

      - name: Build .rpm và gói Arch (.pkg.tar.zst) bằng fpm
        continue-on-error: true      # nếu bước này lỗi thì các file còn lại vẫn được đăng
        run: |
          sudo apt-get install -y ruby rpm libarchive-tools zstd
          sudo gem install --no-document fpm
          VER=$(python -c "import re;print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"',open('archclient/__init__.py').read()).group(1))")
          fpm -s dir -t rpm    -n arch-client -v "$VER" --architecture x86_64 \
              --description "Minecraft launcher for Linux" --url https://archclient.netlify.app \
              -p dist/ArchClient-linux-x86_64.rpm -C build/pkgroot .
          fpm -s dir -t pacman -n arch-client -v "$VER" --architecture x86_64 \
              --description "Minecraft launcher for Linux" --url https://archclient.netlify.app \
              -p dist/ArchClient-linux-x86_64.pkg.tar.zst -C build/pkgroot .

      - name: Kiểm tra nhanh file build
        run: |
          ls -lh dist/
          test -f "dist/ArchClient/ArchClient"

      - name: Đổi tên file (tên cố định để website trỏ link ổn định)
        run: |
          mv dist/*.tar.gz dist/ArchClient-linux-x86_64.tar.gz
          mv dist/*.AppImage dist/ArchClient-linux-x86_64.AppImage
          mv dist/*.deb dist/ArchClient-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ArchClient-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Đăng lên GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Arch Client ${{ inputs.release_tag }}
          files: |
            dist/ArchClient-linux-x86_64.tar.gz
            dist/ArchClient-linux-x86_64.AppImage
            dist/ArchClient-linux-amd64.deb
            dist/ArchClient-linux-x86_64.rpm
            dist/ArchClient-linux-x86_64.pkg.tar.zst
